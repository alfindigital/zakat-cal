name: CI

# Pemeriksaan otomatis tiap ada perubahan kode.
# Hijau (✅) = kode sehat. Merah (❌) = ada yang perlu diperbaiki.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependency
        run: npm install --no-audit --no-fund

      - name: Lint (gaya & error kode)
        run: npm run lint

      - name: Typecheck (cek tipe TypeScript)
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit

      - name: Unit test
        run: npm test

      - name: Build (pastikan bisa dirilis)
        run: npm run build
