name: CI

# Pemeriksaan otomatis tiap ada perubahan kode.
# Hijau (✅) = kode sehat. Merah (❌) = ada yang perlu diperbaiki.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependency
        run: npm install --no-audit --no-fund

      - name: Lint (gaya & error kode)
        run: npm run lint

      - name: Typecheck (cek tipe TypeScript)
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit

      - name: Unit test
        run: npm test

      - name: Build (pastikan bisa dirilis)
        run: npm run build

  e2e-a11y:
    name: E2E aksesibilitas (aria-live, aria-describedby, role=alert)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependency
        run: npm install --no-audit --no-fund

      - name: Pasang browser Playwright
        run: npx playwright install --with-deps chromium

      - name: Jalankan e2e a11y (fail build kalau aria-live / aria-describedby / role=alert berubah)
        run: npm run test:e2e:a11y

      - name: Unggah laporan Playwright (bila gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  e2e-visual:
    name: E2E visual regression (Beranda)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependency
        run: npm install --no-audit --no-fund

      - name: Pasang browser Playwright
        run: npx playwright install --with-deps chromium

      - name: Jalankan visual regression (Beranda)
        run: npm run test:e2e:visual

      - name: Unggah snapshot & laporan (bila gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            playwright-report
            e2e/beranda-visual.spec.ts-snapshots
            test-results
          retention-days: 7


